plugins {
    // app 模块使用 application 插件，产出可安装的 APK。
    alias(libs.plugins.android.application)
}

android {
    // namespace 决定 R、BuildConfig 等生成类的包名。
    namespace 'com.demo.tvlauncher'
    // SDK 版本统一从根工程 config.gradle 读取。
    compileSdk rootProject.ext.android.compileSdk

    defaultConfig {
        applicationId "com.demo.tvlauncher"
        // TV Launcher 兼容老盒子，minSdk 21；可按目标设备在 config.gradle 调整
        minSdk rootProject.ext.android.minSdk
        targetSdk rootProject.ext.android.targetSdk
        versionCode rootProject.ext.appVersion.code
        versionName rootProject.ext.appVersion.name

        testInstrumentationRunner rootProject.ext.android.testInstrumentationRunner
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        buildConfig = true
        // 开启 DataBinding，XML 用 <layout> 包裹后可绑定变量和点击事件。
        dataBinding = true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = rootProject.ext.java.sourceCompatibility
        targetCompatibility = rootProject.ext.java.targetCompatibility
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.recyclerview
    // MVVM 基础
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.runtime

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
